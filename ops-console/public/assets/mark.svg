<!-- The JSP mark, geometry identical to the TV app's
     android/tv/src/main/res/drawable/ic_brand_mark.xml. The two must stay in
     step: this is the same drawing, not a second interpretation of it.

     Two tones rather than a tint, for the reason the Android file gives - the
     globe needs a meridian and an equator drawn back over its own disc, which
     is three alternations of figure and ground on a shape 9 units across. Here
     they are CSS custom properties so one file serves the navy-on-cream header
     and the cream-on-navy loading screen without a second copy. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img"
     aria-label="Jagdamba Smart Pathshala">
  <g fill="none" stroke="var(--mark-ink, #14508C)" stroke-width="2.6" stroke-linecap="round">
    <path d="M19.5 12.84 A5.5 5.5 0 0 1 28.5 12.84" />
    <path d="M16.22 10.55 A9.5 9.5 0 0 1 31.78 10.55" />
    <path d="M12.94 8.25 A13.5 13.5 0 0 1 35.06 8.25" />
  </g>
  <g fill="var(--mark-ink, #14508C)">
    <path d="M23 22.5 C18.5 19.6 11 18.8 4.5 19.4 L4.5 38.4 C11 37.8 18.5 38.6 23 41.5 Z" />
    <path d="M25 22.5 C29.5 19.6 37 18.8 43.5 19.4 L43.5 38.4 C37 37.8 29.5 38.6 25 41.5 Z" />
  </g>
  <path fill="var(--mark-ground, #FAF6EC)" d="M11.6 26.3 L17.4 29.5 L11.6 32.7 Z" />
  <path fill="var(--mark-ground, #FAF6EC)"
        d="M29.7 29.5 A4.6 4.6 0 1 0 38.9 29.5 A4.6 4.6 0 1 0 29.7 29.5 Z" />
  <path fill="var(--mark-ink, #14508C)"
        d="M32.4 29.5 A1.9 4.6 0 1 0 36.2 29.5 A1.9 4.6 0 1 0 32.4 29.5 Z" />
  <path fill="var(--mark-ground, #FAF6EC)"
        d="M33.4 29.5 A0.9 3.9 0 1 0 35.2 29.5 A0.9 3.9 0 1 0 33.4 29.5 Z" />
  <path fill="var(--mark-ink, #14508C)"
        d="M29.7 29.5 A4.6 0.55 0 1 0 38.9 29.5 A4.6 0.55 0 1 0 29.7 29.5 Z" />
</svg>
