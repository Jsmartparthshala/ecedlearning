server {
  listen 80;

  # supabase-kt builds <project-url>/rest/v1/<table>. Strip the prefix and hand
  # the rest to PostgREST, which serves tables at the root.
  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_set_header Host $host;
    proxy_set_header Accept-Profile public;
    proxy_set_header Content-Profile public;
  }

  location / {
    return 404;
  }
}
