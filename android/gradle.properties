# 3 GB heap: you have 16 GB total and the TV emulator wants 2-4 GB of it.
# Going higher makes builds slower, not faster, once the emulator is running.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
